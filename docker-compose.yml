services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: medbridge
    volumes:
      - medbridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbridge -d medbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://medbridge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/medbridge?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      REQUEST_RADIUS_KM: ${REQUEST_RADIUS_KM:-25}
      REQUEST_TTL_HOURS: ${REQUEST_TTL_HOURS:-24}
      RESERVATION_TTL_HOURS: ${RESERVATION_TTL_HOURS:-4}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  medbridge_pg: